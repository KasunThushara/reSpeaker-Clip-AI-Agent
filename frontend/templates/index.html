<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Voice Assistant</h1>

        <div class="chat-box" id="chatBox">
            <div class="message system">Click the mic to start speaking</div>
        </div>

        <div class="controls">
            <button id="micBtn" class="mic-btn" title="Hold to speak">
                <svg id="micIcon" viewBox="0 0 24 24" width="32" height="32">
                    <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <div class="status" id="status">Ready</div>
        </div>

        <audio id="audioPlayer" class="audio-player" controls hidden></audio>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
