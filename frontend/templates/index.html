<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <button id="toolsBtn" class="tools-btn" title="Select tools">🧰 Tools</button>

    <div id="toolsSidebar" class="tools-sidebar" hidden>
        <div class="tools-sidebar-header">
            <span>Composio Tools</span>
            <button id="toolsCloseBtn" class="tools-close-btn">×</button>
        </div>
        <input type="text" id="toolkitSearch" class="tools-search" placeholder="Search apps..." autocomplete="off">
        <div id="toolkitList" class="tools-list"></div>
        <div class="tools-sidebar-footer">
            <button id="toolsApplyBtn" class="connect-btn">Apply</button>
        </div>
    </div>
    <div id="toolsOverlay" class="tools-overlay" hidden></div>

    <div class="container">
        <h1>Voice Assistant</h1>
        <script id="clip-config" type="application/json">{{ clip_config | tojson }}</script>

        <div class="chat-box" id="chatBox">
            <div class="message system">Click the mic to start speaking</div>
        </div>

        <div class="controls">
            <div class="input-row" id="inputModeRow" hidden>
                <label for="inputModeSelect">Input</label>
                <select id="inputModeSelect">
                    <option value="clip">reSpeaker Clip</option>
                    <option value="browser">Browser mic</option>
                </select>
            </div>

            <div class="btn-row">
                <button id="micBtn" class="mic-btn" title="Hold to speak">
                    <svg viewBox="0 0 24 24" width="32" height="32">
                        <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <button id="clipBtn" class="mic-btn clip-btn" title="Click to start or stop reSpeaker Clip recording" hidden>
                    <span id="clipBtnLabel">Clip</span>
                </button>
            </div>
            <div class="status" id="clipStatusLine"></div>
            <div class="status" id="status">Ready</div>
        </div>

        <form id="textForm" class="text-form">
            <input type="text" id="textInput" class="text-input" placeholder="Type a message..." autocomplete="off">
            <button type="submit" id="sendBtn" class="send-btn">Send</button>
        </form>

        <audio id="audioPlayer" class="audio-player" controls hidden></audio>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
